<div class="content-container">

    <div class="mb-4">
        <h2 class="fw-bold mb-1">Explore Products</h2>
        <p class="text-muted">Discover amazing deals from sellers in your neighbourhood</p>
    </div>

    <div class="filter-card">
        <h5 class="fw-bold mb-1">Filters</h5>
        <p class="text-muted small mb-4">Refine your search</p>

        <h6 class="fw-semibold mb-3 fs-6">Categories</h6>
        <div class="d-flex flex-column gap-2 mb-4" id="category-options">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="category" id="catAll" value="all" checked>
                <label class="form-check-label text-muted" for="catAll">All</label>
            </div>
            <!-- Category options are generated from the live listings so the filter never drifts. -->
        </div>

        <button class="btn btn-primary w-100 py-2" id="apply-filters-btn">Apply Filters</button>
    </div>

    <p class="text-muted small mb-3" id="items-count">Loading...</p>

    <div class="row g-4" id="product-listings">
        <!-- Product listings will be injected here -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const productListings = document.getElementById('product-listings');
    const itemsCount = document.getElementById('items-count');
    let allListings = [];
    const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const categoryOptions = document.getElementById('category-options');
    const requestedCategory = new URLSearchParams(window.location.search).get('category');

    // Build the category radio list from the categories actually present in the listings,
    // so the filter can never drift out of sync with what sellers have posted.
    function buildCategoryOptions(listings) {
        const cats = [...new Set(listings.map(l => (l.category || '').trim()).filter(Boolean))].sort();
        cats.forEach((cat, i) => {
            const id = 'cat-' + i;
            const div = document.createElement('div');
            div.className = 'form-check';
            div.innerHTML = `<input class="form-check-input" type="radio" name="category" id="${id}" value="${cat}">` +
                            `<label class="form-check-label text-muted" for="${id}">${cat}</label>`;
            categoryOptions.appendChild(div);
        });
    }

    // Honour the ?category= param passed from the homepage cards.
    function preselectFromUrl() {
        if (!requestedCategory) return;
        const match = [...document.querySelectorAll('input[name="category"]')]
            .find(r => r.value.toLowerCase() === requestedCategory.toLowerCase());
        if (match) match.checked = true;
    }

    function getSelectedCategory() {
        const checked = document.querySelector('input[name="category"]:checked');
        return checked ? checked.value : 'all';
    }

    function render(listings) {
        itemsCount.textContent = `${listings.length} items found`;
        productListings.innerHTML = '';

        if (listings.length === 0) {
            productListings.innerHTML = '<p class="text-center text-muted">No products found.</p>';
            return;
        }

        listings.forEach(listing => {
            const card = document.createElement('div');
            card.className = 'col-md-6';
            card.innerHTML = `
                        <div class="product-card">
                            <div class="card-img-wrapper">
                                <img src="${escapeHtml(listing.image_url) || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?w=600'}" alt="${escapeHtml(listing.title)}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1560393464-5c69a73c5770?w=600'">
                                <div class="card-img-overlay-custom">
                                    <h5>${escapeHtml(listing.title)}</h5>
                                </div>
                            </div>
                            <div class="card-body">
                                <p class="text-muted small mb-0 flex-grow-1">${escapeHtml(listing.description)}</p>
                                <div class="price-text">R${escapeHtml(listing.price)}</div>
                                <div class="row g-2 mt-auto">
                                    <!--<div class="col-6"><button class="btn btn-outline-primary w-100">Wishlist</button></div> -->
                                    <div class="col-6"><button class="btn btn-primary w-100 btn-add-to-cart" data-listing-id="${listing.id}">Add to Cart</button></div>
                                </div>
                            </div>
                        </div>
                    `;
            productListings.appendChild(card);
        });

        document.querySelectorAll('.btn-add-to-cart').forEach(button => button.addEventListener('click', addToCart));
    }

    function applyFilters() {
        const category = getSelectedCategory();
        if (category === 'all') {
            render(allListings);
        } else {
            render(allListings.filter(l => (l.category || '').toLowerCase() === category.toLowerCase()));
        }
    }

    document.getElementById('apply-filters-btn').addEventListener('click', applyFilters);

    fetch('get_listings.php?scope=all')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                allListings = data.data;
                buildCategoryOptions(allListings);
                preselectFromUrl();
                applyFilters(); // honour any category pre-selected from the URL
            } else {
                itemsCount.textContent = 'Could not load items.';
            }
        })
        .catch(error => {
            console.error('Error fetching listings:', error);
            itemsCount.textContent = 'An error occurred.';
        });

    function addToCart(event) {
        const button = event.currentTarget;
        const listingId = button.dataset.listingId;
        const originalText = button.innerHTML;

        button.disabled = true;
        button.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';

        const formData = new FormData();
        formData.append('listing_id', listingId);

        fetch('add_to_cart.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    button.innerHTML = '<i class="bi bi-check-lg"></i> Added';
                    setTimeout(() => {
                        button.disabled = false;
                        button.innerHTML = originalText;
                    }, 2000);
                } else {
                    alert(data.error || 'Failed to add to cart.');
                    button.disabled = false;
                    button.innerHTML = originalText;
                }
            })
            .catch(err => {
                alert('An error occurred.');
                button.disabled = false;
                button.innerHTML = originalText;
            });
    }
});
</script>
