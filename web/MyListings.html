<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - NextDoorSA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="libs/bootstrap-icons/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background-color: #3b74f2;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        /* Main Container */
        .content-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 15px;
        }

        /* Header Elements */
        .header-icon {
            width: 50px;
            height: 50px;
            background-color: #3b74f2;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .btn-create {
            background-color: #3b74f2;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
        }
        .btn-create:hover {
            background-color: #2b5bc7;
        }

        /* Stats Cards */
        .stat-card {
            background: white;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            padding: 20px;
            height: 100%;
        }

        .stat-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }
        .icon-blue { background-color: #e8f0fe; color: #3b74f2; }
        .icon-green { background-color: #e6f8ed; color: #28a745; }
        .icon-purple { background-color: #f3e8fe; color: #9c27b0; }

        /* Listing Cards */
        .listing-card {
            background: white;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .listing-img-wrapper {
            position: relative;
            height: 220px;
        }
        .listing-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Badges */
        .badge-status {
            position: absolute;
            top: 15px; left: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .badge-active { background-color: #e6f8ed; color: #28a745; }
        .badge-sold { background-color: #f8f9fa; color: #6c757d; border: 1px solid #dee2e6; }

        .badge-category {
            position: absolute;
            top: 15px; right: 15px;
            background: white;
            color: #333;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Card Content */
        .listing-card .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .price-text {
            color: #3b74f2;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .meta-info {
            font-size: 0.8rem;
            color: #8c98a4;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Action Buttons */
        .btn-edit {
            background-color: #f8f9fa;
            color: #495057;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 10px;
        }
        .btn-edit:hover { background-color: #e9ecef; }

        .btn-delete {
            background-color: #fff0f0;
            color: #dc3545;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            padding: 10px;
        }
        .btn-delete:hover { background-color: #ffe3e3; color: #dc3545; }

        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .error {
            color: #dc3545;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="Home.html">
            <i class="bi bi-intersect fs-2"></i> NextDoorSA
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center gap-4">
                <li class="nav-item"><a class="nav-link text-white fw-medium" href="Home.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white fw-medium" href="ExploreProductsPage.html">Explore</a></li>
                <li class="nav-item"><a class="nav-link text-white fw-medium" href="CreateAListing.html">Create Listing</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="MyListings.html"> My Listings</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="ShoppingCart.html"><i class="bi bi-cart2 fs-5"></i> Cart</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link text-white fw-medium dropdown-toggle" href="#" id="accountDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Account</a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="accountDropdown">
                        <li><a class="dropdown-item" href="CreateAnAccount.html">Create Account</a></li>
                        <li><a class="dropdown-item" href="LogIntoAccount.html">Log In</a></li>
                        <li><a class="dropdown-item" href="Profile.html">Profile</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="content-container">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div class="d-flex align-items-center">
            <div class="header-icon me-3">
                <i class="bi bi-box-seam"></i>
            </div>
            <div>
                <h3 class="fw-bold mb-0">My Listings</h3>
                <p class="text-muted small mb-0">Manage and track your product listings</p>
            </div>
        </div>
        <button class="btn btn-primary btn-create text-white shadow-sm" onclick="window.location.href='CreateAListing.html'">
            <i class="bi bi-plus-lg me-1"></i> Create New Listing
        </button>
    </div>

    <div class="row g-3 mb-4 pb-2" id="stats-container">
        <!-- Stats will be populated dynamically -->
        <div class="col-4">
            <div class="stat-card">
                <div class="stat-icon icon-blue"><i class="bi bi-box"></i></div>
                <p class="text-muted small mb-1">Active Listings</p>
                <h3 class="fw-bold mb-0" id="stat-active">-</h3>
            </div>
        </div>
        <div class="col-4">
            <div class="stat-card">
                <div class="stat-icon icon-green"><i class="bi bi-graph-up-arrow"></i></div>
                <p class="text-muted small mb-1">Items Sold</p>
                <h3 class="fw-bold mb-0" id="stat-sold">-</h3>
            </div>
        </div>
        <div class="col-4">
            <div class="stat-card">
                <div class="stat-icon icon-purple"><i class="bi bi-eye"></i></div>
                <p class="text-muted small mb-1">Total Views</p>
                <h3 class="fw-bold mb-0" id="stat-views">-</h3>
            </div>
        </div>
    </div>

    <div class="row g-4" id="listings-container">
        <div class="col-12 loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading your listings...</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const listingsContainer = document.getElementById('listings-container');
    const statActive = document.getElementById('stat-active');
    const statSold = document.getElementById('stat-sold');
    const statViews = document.getElementById('stat-views');

    const fmt = (v) => new Intl.NumberFormat('en-ZA', { style: 'currency', currency: 'ZAR' }).format(v);

    function timeAgo(dateString) {
        const date = new Date(dateString);
        const seconds = Math.floor((new Date() - date) / 1000);

        let interval = seconds / 31536000;
        if (interval > 1) return Math.floor(interval) + " years ago";
        interval = seconds / 2592000;
        if (interval > 1) return Math.floor(interval) + " months ago";
        interval = seconds / 86400;
        if (interval > 1) return Math.floor(interval) + " days ago";
        interval = seconds / 3600;
        if (interval > 1) return Math.floor(interval) + " hours ago";
        interval = seconds / 60;
        if (interval > 1) return Math.floor(interval) + " minutes ago";
        return Math.floor(seconds) + " seconds ago";
    }

    fetch('get_listings.php?scope=user')
        .then(response => {
            if (response.status === 401) {
                window.location.href = 'LogIntoAccount.html';
                throw new Error('Not logged in');
            }
            return response.json();
        })
        .then(result => {
            if (!result.success) {
                throw new Error(result.error || 'Failed to fetch listings');
            }

            const listings = result.data;
            listingsContainer.innerHTML = '';

            if (listings.length === 0) {
                listingsContainer.innerHTML = `
                    <div class="col-12 text-center p-5">
                        <i class="bi bi-inbox text-muted" style="font-size: 3rem;"></i>
                        <p class="mt-3 text-muted">You don't have any listings yet.</p>
                        <button class="btn btn-outline-primary mt-2" onclick="window.location.href='CreateAListing.html'">Create your first listing</button>
                    </div>`;

                statActive.textContent = '0';
                statSold.textContent = '0';
                statViews.textContent = '0';
                return;
            }

            let activeCount = 0;
            let soldCount = 0;
            let viewsCount = 0;

            listings.forEach(listing => {
                // Update stats
                if (listing.status.toLowerCase() === 'active') activeCount++;
                if (listing.status.toLowerCase() === 'sold') soldCount++;
                viewsCount += Number(listing.views) || 0;

                // Build card
                const isActive = listing.status.toLowerCase() === 'active';
                const opacityClass = isActive ? '' : 'opacity-75';
                const badgeClass = isActive ? 'badge-active' : 'badge-sold';
                const badgeIcon = isActive ? 'text-success' : 'text-secondary';
                const badgeText = isActive ? 'Active' : 'Sold';
                const editDisabled = isActive ? '' : 'disabled';

                const card = document.createElement('div');
                card.className = 'col-md-6';
                card.innerHTML = `
                    <div class="listing-card ${opacityClass}">
                        <div class="listing-img-wrapper">
                            <img src="${listing.image_url || 'https://images.unsplash.com/photo-1560393464-5c69a73c5770?w=600'}" alt="${listing.title}">
                            <span class="badge-status ${badgeClass}">
                                <i class="bi bi-circle-fill ${badgeIcon}" style="font-size: 0.4rem;"></i> ${badgeText}
                            </span>
                            <span class="badge-category">${listing.category || 'Uncategorized'}</span>
                        </div>
                        <div class="card-body">
                            <h6 class="fw-bold mb-2">${listing.title}</h6>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="price-text">${fmt(listing.price)}</span>
                                <span class="meta-info"><i class="bi bi-eye"></i> ${listing.views || 0}</span>
                            </div>
                            <div class="meta-info mb-4">
                                <i class="bi bi-clock"></i> ${timeAgo(listing.created_at)}
                            </div>
                            <div class="row g-2 mt-auto">
                                <div class="col-6">
                                    <button class="btn btn-edit w-100" ${editDisabled}><i class="bi bi-pencil-square me-1"></i> Edit</button>
                                </div>
                                <div class="col-6">
                                    <button class="btn btn-delete w-100" data-listing-id="${listing.id}"><i class="bi bi-trash3 me-1"></i> Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                listingsContainer.appendChild(card);
            });

            // Render stats
            statActive.textContent = activeCount;
            statSold.textContent = soldCount;
            statViews.textContent = viewsCount;

            document.querySelectorAll('.btn-delete').forEach(button => button.addEventListener('click', deleteListing));

        })
        .catch(error => {
            if (error.message !== 'Not logged in') {
                console.error('Error fetching listings:', error);
                listingsContainer.innerHTML = `
                    <div class="col-12 error">
                        <i class="bi bi-exclamation-triangle" style="font-size: 2rem;"></i>
                        <p class="mt-2">Failed to load listings. Please ensure you are logged in.</p>
                        <small class="text-muted">${error.message}</small>
                    </div>
                `;
            }
        });

    function deleteListing(event) {
        const button = event.target;
        const listingId = button.dataset.listingId;

        if (!confirm('Are you sure you want to delete this listing?')) {
            return;
        }

        const formData = new FormData();
        formData.append('listing_id', listingId);

        fetch('delete_listing.php', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Remove the card from the view
                    button.closest('.col-md-6').remove();
                } else {
                    alert(data.error || 'Failed to delete listing.');
                }
            })
            .catch(err => alert('An error occurred.'));
    }
});
</script>
</body>
</html>
