<div class="container px-3">
    <div class="auth-card">
        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-muted small mb-4">Fill in your details to get started</p>

        <div id="alert-container"></div>

        <form id="create-account-form">
            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label" for="first_name">First Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                        <input type="text" id="first_name" name="first_name" class="form-control border-start-0 ps-0" placeholder="John" required>
                    </div>
                </div>
                <div class="col-6">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="phone">Phone Number</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone"></i></span>
                    <input type="tel" id="phone" name="phone" class="form-control border-start-0 ps-0" placeholder="+27 123 456 789">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" minlength="8" required>
                    <button class="input-group-text bg-light" type="button" id="toggle-password" tabindex="-1" aria-label="Show password"><i class="bi bi-eye" id="toggle-password-icon"></i></button>
                </div>
                <div class="form-text mt-2">Must be at least 8 characters</div>
            </div>

            <div class="form-check mb-4 mt-3">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label" for="termsCheck">
                    I agree to the <a href="#" class="text-primary text-decoration-none">Terms of Service</a> and <a href="#" class="text-primary text-decoration-none">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" id="submit-btn">
                Create Account <i class="bi bi-arrow-right ms-1"></i>
            </button>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('create-account-form');
    const alertContainer = document.getElementById('alert-container');
    const submitBtn = document.getElementById('submit-btn');

    // Show/hide password toggle
    const pwToggle = document.getElementById('toggle-password');
    const pwInput = document.getElementById('password');
    const pwIcon = document.getElementById('toggle-password-icon');
    pwToggle.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        pwIcon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
        pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Clear previous alerts
        alertContainer.innerHTML = '';

        // Disable button to prevent double submission
        submitBtn.disabled = true;
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Creating...';

        const formData = new FormData(form);

        fetch('create_user.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                // Show success message
                alertContainer.innerHTML = `
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> ${data.message} Redirecting to Home...
                    </div>
                `;

                // Redirect after 2 seconds
                setTimeout(() => {
                    window.location.href = 'Home.html';
                }, 2000);
            } else {
                // Show error message
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> ${data.error}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnText;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alertContainer.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> An unexpected error occurred. Please try again.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            // Re-enable button
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalBtnText;
        });
    });
});
</script>
